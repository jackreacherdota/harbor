name: Build Harbor Android Universal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-harbor-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK / NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

          "$SDKMANAGER" --list_installed

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal Android APK
        shell: bash
        run: |
          pnpm tauri android build \
            --apk \
            --debug \
            --target aarch64 \
            --target armv7 \
            --config src-tauri/tauri.android.conf.json

      - name: Find APK
        shell: bash
        run: |
          echo "Generated APK files:"
          find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" -print || true

          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*universal*.apk" | head -n 1 || true)"

          if [ -z "$APK" ]; then
            APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1 || true)"
          fi

          if [ -z "$APK" ]; then
            echo "No APK was generated."
            exit 1
          fi

          mkdir -p out
          cp "$APK" "out/Harbor-Android-Phone-TV-universal.apk"
          ls -lh "out/Harbor-Android-Phone-TV-universal.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-Android-Phone-TV-universal
          path: out/Harbor-Android-Phone-TV-universal.apk
          if-no-files-found: error
          retention-days: 14
